# Set the root logger level to INFO and assign appenders named 'stdout' and 'file'
log4j.rootLogger=INFO, stdout, file

# --- CONSOLE APPENDER CONFIGURATION ---
# Direct log messages to the standard system console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
# Format: Date [Thread] Level Class:Line - Message
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1}:%L - %m%n

# --- FILE APPENDER CONFIGURATION ---
# Direct log messages to a file that rolls over when it reaches a certain size
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/app.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1}:%L - %m%n

# --- OPTIONAL: CUSTOM PACKAGE LOGGING LEVELS ---
# Change logging level for specific frameworks or third-party libraries
log4j.logger.org.hibernate=WARN
log4j.logger.org.springframework=ERROR
