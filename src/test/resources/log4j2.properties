status = error
name = PropertiesConfig


# Appender: Console
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} [%t] [%X{testContext}] %-5level %logger - %msg%n


# Appender: File
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = logs/app.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c - %m%n


# Root Logger
rootLogger.level = debug
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender

# List the custom loggers (comma-separated list of keys)
loggers = opentelemetry, selenium

# Configure OpenTelemetry Logger
logger.opentelemetry.name = io.opentelemetry
logger.opentelemetry.level = WARN

# Configure Selenium Internal Logger
logger.selenium.name = org.openqa.selenium
logger.selenium.level = WARN